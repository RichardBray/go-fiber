name: Run Project Tests

on:
  push:
    branches:
      - dagger
      - dagger-test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v

    - name: Notify Better Stack on failure
      if: failure()
      run: |
        curl -X POST "https://uptime.betterstack.com/api/v1/incoming-webhook/JcPJ3i9kbeaaw974EC4EyFP8" \
          -H "Content-Type: application/json" \
          -d '{
            "summary": "Build failed for ${{ github.repository }}",
            "description": "Workflow ${{ github.workflow }} failed on branch ${{ github.ref_name }}",
            "source": "GitHub Actions",
            "severity": "error",
            "metadata": {
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "workflow": "${{ github.workflow }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
          }'
