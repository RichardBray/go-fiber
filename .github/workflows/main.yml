name: Run Project Tests

on:
  push:
    branches:
      - dagger
      - dagger-test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23

    - name: Install dependencies
      run: go mod download

    - name: Run tests
      run: go test -v

    - name: Notify Better Stack on failure
      if: failure()
      run: |
        curl -X POST "https://uptime.betterstack.com/api/v1/incoming-webhook/JcPJ3i9kbeaaw974EC4EyFP8" \
          -H "Content-Type: application/json" \
          -d '{
            "summary": "${{ github.workflow }} failed: Go tests in ${{ github.repository }}",
            "incident_key": "${{ github.workflow }}-${{ github.ref_name }}",
            "severity": "error",
            "metadata": {
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}"
            }
          }'

    - name: Notify Better Stack on success
      if: success()
      run: |
        curl -X POST "https://uptime.betterstack.com/api/v1/incoming-webhook/JcPJ3i9kbeaaw974EC4EyFP8" \
          -H "Content-Type: application/json" \
          -d '{
            "summary": "${{ github.workflow }} passed: Go tests in ${{ github.repository }}",
            "incident_key": "${{ github.workflow }}-${{ github.ref_name }}",
            "severity": "error",
            "metadata": {
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}"
            }
          }'
