name: Go

on:
  push:
    branches:
      - dagger

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Call Dagger Function to build and test
      uses: dagger/dagger-for-github@v7
      with:
        call: test --source .
        cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

